name: .NET

on:
  push:
    branches:
      - prod
      - beta

permissions:
  contents: read

concurrency:
  group: nuget-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, Test & Pack NuGet
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package_version: ${{ steps.package.outputs.version }}
      package_sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.x

      - name: Validate branch version
        shell: bash
        run: |
          package_version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' VERSION)
          project_version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' code/Universe/UniverseQuery.csproj)
          if [[ -z "$package_version" ]]; then
            echo "VERSION does not contain a package version."
            exit 1
          fi
          if [[ "$package_version" != "$project_version" ]]; then
            echo "VERSION and UniverseQuery.csproj must contain the same package version."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" == "beta" && "$package_version" != *-* ]]; then
            echo "The beta branch requires a prerelease package version."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" == "prod" && "$package_version" == *-* ]]; then
            echo "The prod branch requires a stable package version."
            exit 1
          fi
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

      - name: Restore dependencies
        working-directory: ./code
        run: dotnet restore

      - name: Build release
        working-directory: ./code
        run: dotnet build -c Release --no-restore

      - name: Test release
        working-directory: ./code
        run: dotnet test -c Release --no-build --filter "Category!=Performance" --verbosity normal

      - name: Pack and validate compatibility
        run: dotnet pack code/Universe/UniverseQuery.csproj -c Release --no-build --no-restore --output "$RUNNER_TEMP/nuget-package"

      - name: Record package metadata
        id: package
        shell: bash
        run: |
          package_path="$RUNNER_TEMP/nuget-package/UniverseQuery.${PACKAGE_VERSION}.nupkg"
          if [[ ! -f "$package_path" ]]; then
            echo "Expected package was not created: $package_path"
            exit 1
          fi

          package_sha256=$(sha256sum "$package_path")
          package_sha256="${package_sha256%% *}"
          echo "path=$package_path" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$package_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: universequery-nupkg-${{ github.sha }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish NuGet
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: universequery-nupkg-${{ github.sha }}
          path: ${{ runner.temp }}/nuget-package

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.x

      - name: Verify package artifact
        id: package
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.package_version }}
          EXPECTED_SHA256: ${{ needs.build.outputs.package_sha256 }}
        run: |
          if [[ ! "$EXPECTED_VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]; then
            echo "Build job returned an invalid package version."
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Build job returned an invalid package digest."
            exit 1
          fi

          mapfile -t package_files < <(find "$RUNNER_TEMP/nuget-package" -maxdepth 1 -type f -name '*.nupkg' -print)
          if [[ "${#package_files[@]}" -ne 1 ]]; then
            echo "The artifact must contain exactly one NuGet package."
            exit 1
          fi

          package_path="${package_files[0]}"
          expected_name="UniverseQuery.${EXPECTED_VERSION}.nupkg"
          if [[ "$(basename "$package_path")" != "$expected_name" ]]; then
            echo "Package filename does not match the expected version."
            exit 1
          fi

          package_sha256=$(sha256sum "$package_path")
          package_sha256="${package_sha256%% *}"
          if [[ "$package_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "Package digest does not match the build job output."
            exit 1
          fi

          mapfile -t nuspec_files < <(unzip -Z1 "$package_path" | sed -n '/^[^/]*\.nuspec$/p')
          if [[ "${#nuspec_files[@]}" -ne 1 ]]; then
            echo "The package must contain exactly one root NuSpec file."
            exit 1
          fi

          package_id=$(unzip -p "$package_path" "${nuspec_files[0]}" | sed -n 's:.*<id>\([^<]*\)</id>.*:\1:p')
          package_version=$(unzip -p "$package_path" "${nuspec_files[0]}" | sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p')
          if [[ "$package_id" != "UniverseQuery" || "$package_version" != "$EXPECTED_VERSION" ]]; then
            echo "NuSpec identity does not match the expected package and version."
            exit 1
          fi

          echo "path=$package_path" >> "$GITHUB_OUTPUT"

      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: dotnet nuget push "$PACKAGE_PATH" --api-key "$NUGET_API_KEY" --source "https://api.nuget.org/v3/index.json"
